<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 346" width="880" height="346" role="img" aria-label="L4の22 GiBでは読み込みで不足。A100では最大18.0 GiBで動いた" font-family="'Segoe UI','Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans JP',sans-serif">
<rect x="0.5" y="0.5" width="879" height="345" rx="12" fill="#FFFFFF" stroke="#D1D5DB"/>
<text x="32" y="44" font-size="20" font-weight="700" fill="#111827">L4の22 GiBでは読み込みで不足。A100では最大18.0 GiBで動いた</text>
<text x="32" y="70" font-size="13.5" fill="#6B7280">同じモデル、同じ入力、同じ読み込み手順（BF16）。変えたのはGPUだけ。PyTorchが確保した量</text>
<text x="32" y="104" font-size="12.5" fill="#6B7280">GPUと場面</text>
<text x="250" y="104" font-size="12.5" fill="#6B7280">GPUメモリ（GiB）。灰色の帯がそのGPUの全容量</text>
<text x="32" y="137" font-size="14" font-weight="700" fill="#111827">L4<tspan font-weight="400" fill="#6B7280" font-size="12">　全22.0 GiB</tspan></text>
<text x="32" y="155" font-size="12" fill="#6B7280">読み込みの途中で停止</text>
