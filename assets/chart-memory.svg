<text x="32" y="241" font-size="14" font-weight="700" fill="#111827">A100<tspan font-weight="400" fill="#6B7280" font-size="12">　全39.5 GiB</tspan></text>
<text x="32" y="259" font-size="12" fill="#6B7280">請求書の判定中（最大）</text>
