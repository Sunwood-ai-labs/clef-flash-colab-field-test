<path d="M726.5 130l12 12M738.5 130l-12 12" stroke="#111827" stroke-width="2.5"/>
<text x="258" y="141" font-size="12.5" font-weight="700" fill="#FFFFFF">使用中 17.76</text>
<text x="553.7" y="141" font-size="12.5" font-weight="700" fill="#111827">追加で要求 17.23</text>
<text x="750.5" y="141" font-size="12.5" font-weight="700" fill="#111827">不足</text>
<line x1="543.7" x2="543.7" y1="118" y2="154" stroke="#111827" stroke-width="1.5"/>
<text x="543.7" y="168" font-size="11.5" text-anchor="middle" fill="#6B7280">L4の上限 22.03</text>
<text x="32" y="189" font-size="14" font-weight="700" fill="#111827">A100<tspan font-weight="400" fill="#6B7280" font-size="12">　全39.5 GiB</tspan></text>
